name: QuickDict

options:
  bundleIdPrefix: com.kexin
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  QuickDict:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kexin.quickdict
        PRODUCT_NAME: QuickDict
        PRODUCT_MODULE_NAME: QuickDict
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/QuickDictStore.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        ONLY_ACTIVE_ARCH: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          DEAD_CODE_STRIPPING: YES

  QuickDictTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QuickDictTests
    dependencies:
      - target: QuickDict
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kexin.quickdict.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QuickDict.app/Contents/MacOS/QuickDict"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  QuickDict:
    build:
      targets:
        QuickDict: all
        QuickDictTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - QuickDictTests
    run:
      config: Debug
    archive:
      config: Release
