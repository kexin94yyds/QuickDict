<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#18231d" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe5d9"/>
      <stop offset="1" stop-color="#edf5ef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8faf8"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="180" cy="160" r="220" fill="#d6bb85" opacity="0.19"/>
  <circle cx="1310" cy="760" r="270" fill="#8fc2a4" opacity="0.18"/>

  <text x="120" y="108" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="54" font-weight="700" fill="#17211c">记住它，而不只是查过它</text>
  <text x="123" y="156" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="23" fill="#53635a">内置复习排期，把收藏慢慢变成长久记忆</text>

  <g filter="url(#shadow)">
    <rect x="335" y="205" width="770" height="640" rx="22" fill="url(#panel)"/>
    <rect x="335" y="205" width="770" height="54" rx="22" fill="#eceeea"/>
    <rect x="335" y="240" width="770" height="19" fill="#eceeea"/>
    <circle cx="366" cy="232" r="7" fill="#ff5f57"/>
    <circle cx="390" cy="232" r="7" fill="#febc2e"/>
    <circle cx="414" cy="232" r="7" fill="#28c840"/>
    <text x="720" y="239" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="15" font-weight="600" fill="#4d514e">复习 · 1 / 3</text>

    <text x="388" y="309" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#6d7d72">今天的单词</text>
    <text x="388" y="363" font-family="Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="700" fill="#17211c">serendipity</text>
    <text x="388" y="397" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#7d8981">/ˌserənˈdipədē/ · noun</text>

    <rect x="388" y="430" width="664" height="90" rx="14" fill="#f0f5f1"/>
    <rect x="388" y="430" width="5" height="90" rx="3" fill="#4e8b68"/>
    <text x="416" y="464" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#314038">“We found the little bookstore by pure</text>
    <text x="416" y="492" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#314038">serendipity on a rainy afternoon.”</text>

    <text x="388" y="561" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#728078">释义</text>
    <text x="388" y="597" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="21" fill="#202a24">意外发现有趣或美好事物的幸运。</text>
    <text x="388" y="632" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" fill="#67736b">a happy or beneficial discovery made by chance</text>

    <line x1="388" y1="669" x2="1052" y2="669" stroke="#e1e6e2"/>
    <text x="388" y="708" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="14" fill="#77837b">这次想得怎么样？</text>
    <g font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="14" font-weight="600">
      <rect x="388" y="729" width="126" height="47" rx="12" fill="#f7ecea" stroke="#e6c4be"/>
      <text x="451" y="758" text-anchor="middle" fill="#8a4439">忘了</text>
      <rect x="528" y="729" width="126" height="47" rx="12" fill="#faf2df" stroke="#e8d09d"/>
      <text x="591" y="758" text-anchor="middle" fill="#806329">困难</text>
      <rect x="668" y="729" width="126" height="47" rx="12" fill="#eaf3ec" stroke="#bcd7c4"/>
      <text x="731" y="758" text-anchor="middle" fill="#37684a">还好</text>
      <rect x="808" y="729" width="126" height="47" rx="12" fill="#26724c"/>
      <text x="871" y="758" text-anchor="middle" fill="#ffffff">简单</text>
      <rect x="948" y="729" width="104" height="47" rx="12" fill="#f3f5f3" stroke="#d5dcd7"/>
      <text x="1000" y="758" text-anchor="middle" fill="#5d6961">跳过</text>
    </g>
    <text x="720" y="815" text-anchor="middle" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="13" fill="#8a948d">根据你的回答自动安排下一次复习</text>
  </g>
</svg>
